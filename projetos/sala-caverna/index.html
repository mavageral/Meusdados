<title>Caverna</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=DotGothic16&display=swap">
<style>
/* Caverna: app de estudos em uma coluna de celular (expande para 2 colunas no desktop).
   Base escura profunda, vidro, tipografia gigante, cada área com seu gradiente (referências pétreas 1–9). */
:root{
  --bg:#05060A; --bg-2:#0B0D14;
  --glass:rgb(255 255 255 / .055); --glass-2:rgb(255 255 255 / .09); --edge:rgb(255 255 255 / .10); --edge-2:rgb(255 255 255 / .18);
  --text:#F3F4F8; --muted:#A3A8BA; --faint:#8A8FA6;
  --ok:#5EE6A0; --warn:#FFC24B; --bad:#FF6B81;
  --c:#FF6A1A; --c-2:#FFB37A; --on-light:#08090D; --on-c:#1A0A04; --on-ok:#05220F; --on-bad:#2A0509;           /* laranja do assistente C */
  --font:"Geist",system-ui,-apple-system,sans-serif; --mono:"Geist Mono",ui-monospace,monospace; --dot:"DotGothic16",var(--mono);
  --r:22px; --r-sm:14px; --pill:999px;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
  /* áreas: [claro, escuro] */
  --a-oracao-1:#FFB547; --a-oracao-2:#7A2E0E;
  --a-biblia-1:#A88BFF; --a-biblia-2:#33186E;
  --a-min-1:#FF7BA5;    --a-min-2:#5E1236;
  --a-saude-1:#5EE6A0;  --a-saude-2:#0F4A33;
  --a-grad-1:#6E9BFF;   --a-grad-2:#132C7A;
  --a-tech-1:#46E3F2;   --a-tech-2:#06485E;
  --a-anbima-1:#F7D23E; --a-anbima-2:#5C4500;
  --a-pausa-1:#9AA2B8;  --a-pausa-2:#1D2230;
  --a-rev-1:#9AA5FF;    --a-rev-2:#222C77;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%;scroll-padding-bottom:110px}
body{margin:0;background:radial-gradient(120% 60% at 50% -10%,rgb(70 80 200 / .18),transparent 60%),var(--bg);color:var(--text);
  font:15px/1.5 var(--font);min-height:100dvh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--c);outline-offset:2px;border-radius:8px}
h1,h2,h3,p{margin:0}
.app{max-width:1180px;margin:0 auto;padding-top:calc(env(safe-area-inset-top,0px) + 14px)}
.view{display:grid;gap:18px;animation:in .45s var(--ease)}
@keyframes in{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:var(--r);box-shadow:inset 0 1px 0 rgb(255 255 255 / .07);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.pad{padding:18px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 12px;border-radius:var(--pill);border:1px solid var(--edge);background:var(--glass);font-size:13px;white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:currentColor;display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:var(--pill);border:1px solid var(--edge-2);background:var(--glass-2);font-weight:600;white-space:nowrap;transition:transform .15s var(--ease),filter .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--text);color:var(--on-light);border-color:transparent}
.btn.c{background:var(--c);color:var(--on-c);border-color:transparent;box-shadow:0 8px 30px rgb(255 106 26 / .35)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.sm{min-height:38px;padding:0 14px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.icon{width:20px;height:20px;flex:none}
.grid2{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.title-xl{font-weight:300;font-size:clamp(44px,13vw,76px);line-height:.95;letter-spacing:-.04em;text-wrap:balance}
.title-l{font-weight:400;font-size:clamp(28px,7vw,40px);line-height:1.05;letter-spacing:-.03em;text-wrap:balance}
.title-m{font-weight:500;font-size:20px;line-height:1.2;letter-spacing:-.01em}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h h2{font-weight:500;font-size:17px}
.link{background:none;border:0;color:var(--muted);font-size:13px;padding:6px 0;text-decoration:underline;text-underline-offset:3px}

/* ---------- topo ---------- */
.top{display:flex;align-items:center;gap:12px;justify-content:space-between}
.avatar{width:44px;height:44px;border-radius:50%;border:1px solid var(--edge-2);background:linear-gradient(135deg,var(--c),#7A2E0E);display:grid;place-items:center;font-weight:700;overflow:hidden;flex:none;padding:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.lema{font:500 11px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hello{display:grid;gap:6px}
.dayline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ring{--p:0;width:64px;height:64px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:radial-gradient(closest-side,var(--bg-2) 80%,transparent 81% 100%),conic-gradient(var(--c) calc(var(--p)*1%),rgb(255 255 255 / .1) 0)}
.ring b{font:400 20px/1 var(--dot)}
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.weekstrip button{min-height:56px;border-radius:16px;border:1px solid var(--edge);background:var(--glass);display:grid;place-items:center;gap:2px;padding:6px 0}
.weekstrip button small{font:500 11px var(--mono);color:var(--muted);letter-spacing:.06em}
.weekstrip button b{font-weight:500;font-size:16px}
.weekstrip button[aria-pressed="true"]{background:var(--text);color:var(--on-light);border-color:transparent}
.weekstrip button[aria-pressed="true"] small{color:#3a3d48}
.weekstrip button .dot{width:5px;height:5px;border-radius:50%;background:var(--ok)}

/* ---------- agora ---------- */
.now{position:relative;overflow:hidden;border-radius:28px;padding:22px;min-height:220px;display:grid;align-content:space-between;gap:18px;
  background:radial-gradient(120% 90% at 100% 100%,var(--g1) 0%,transparent 55%),linear-gradient(160deg,var(--g2),#06070C 85%);border:1px solid var(--edge-2)}
.now::after{content:"";position:absolute;inset:auto -20% -60% auto;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,var(--g1),transparent 70%);opacity:.35;filter:blur(10px);pointer-events:none}
.now .label{font-weight:400;font-size:clamp(30px,8vw,44px);line-height:1;letter-spacing:-.03em;text-wrap:balance;position:relative}
.now .meta{display:flex;gap:8px;flex-wrap:wrap;position:relative}
.now .acts{display:flex;gap:10px;flex-wrap:wrap;position:relative}
.bar{height:6px;border-radius:99px;background:rgb(255 255 255 / .12);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;border-radius:inherit;background:var(--text)}

/* ---------- bento ---------- */
.bento{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{position:relative;overflow:hidden;border-radius:24px;padding:16px;min-height:138px;display:grid;align-content:space-between;gap:8px;border:1px solid var(--edge);text-align:left;
  background:radial-gradient(90% 80% at 85% 10%,var(--g1),transparent 65%),linear-gradient(160deg,var(--g2),#07080D)}
.tile .big{font:400 34px/1 var(--dot);letter-spacing:.02em}
.tile .lbl{font-size:13px;color:rgb(255 255 255 / .82)}
.tile .sub{font-size:12px;color:rgb(255 255 255 / .66)}
.tile.wide{grid-column:span 2}

/* ---------- timeline ---------- */
.tl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.tl button{width:100%;display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:18px;border:1px solid var(--edge);background:var(--glass);min-height:60px}
.tl time{font:500 12px/1.25 var(--mono);color:var(--muted)}
.tl .t{min-width:0}
.tl .t b{display:block;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .t small{color:var(--muted);font-size:12px}
.tl .st{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--edge-2)}
.tl .st.done{background:var(--ok);border-color:transparent;color:var(--on-ok)}
.tl .st.miss{background:var(--bad);border-color:transparent;color:var(--on-bad)}
.tl li.isnow button{border-color:var(--edge-2);background:linear-gradient(90deg,color-mix(in srgb,var(--g1) 22%,transparent),var(--glass))}
.tl li.past:not(.closed) button{opacity:.78}
.tl .bul{width:8px;height:8px;border-radius:50%;background:var(--g1);display:inline-block;margin-right:6px;vertical-align:middle}

/* ---------- tabs ---------- */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:40;display:flex;align-items:center;gap:4px;padding:6px;border-radius:var(--pill);
  background:rgb(14 16 24 / .82);border:1px solid var(--edge-2);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);box-shadow:0 20px 50px rgb(0 0 0 / .55)}
.tabbar button{border:0;background:none;color:var(--muted);min-width:52px;height:50px;border-radius:var(--pill);display:grid;place-items:center;gap:0;padding:0 10px}
.tabbar button span{font-size:11px;font-weight:500}
.tabbar button[aria-current="page"]{background:var(--glass-2);color:var(--text)}
.tabbar .cbtn{width:58px;height:58px;margin:0 4px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFB37A,var(--c) 55%,#B83A00);color:var(--on-c);font:700 24px/1 var(--font);box-shadow:0 0 0 4px rgb(255 106 26 / .16),0 10px 30px rgb(255 106 26 / .45)}
.tabbar .cbtn.pulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgb(255 106 26 / .08),0 10px 30px rgb(255 106 26 / .55)}}

/* ---------- sheet (tela cheia em passos, referência 4) ---------- */
.sheet{position:fixed;inset:0;z-index:60;display:grid;grid-template-rows:auto 1fr auto;background:var(--sbg,linear-gradient(170deg,#1A0C05,#05060A 55%));
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));animation:up .35s var(--ease)}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet[hidden]{display:none!important}
.sh-top{display:flex;align-items:center;gap:10px;max-width:760px;width:100%;margin:0 auto}
.sh-body{overflow-y:auto;overscroll-behavior:contain;max-width:760px;width:100%;margin:0 auto;padding:18px 0 28px;display:grid;align-content:start;gap:18px}
.sh-foot{margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));background:#000;border-radius:28px 28px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--edge)}
.sh-foot .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:8px;height:8px;border-radius:50%;border:1px solid var(--muted)}
.dots i.on{background:var(--text);border-color:var(--text);width:22px;border-radius:99px}
.dots i.done{background:var(--muted);border-color:var(--muted)}
.next{margin-left:auto;display:inline-flex;align-items:center;gap:12px;background:none;border:0;font:300 clamp(24px,6.6vw,38px)/1 var(--font);letter-spacing:-.03em;padding:6px 0;min-height:56px;white-space:nowrap}
.next .arrow{width:40px;height:40px;border-radius:50%;background:var(--text);color:#000;display:grid;place-items:center}
.next:disabled{opacity:.35}
.x{width:44px;height:44px;border-radius:50%;border:1px solid var(--edge-2);background:var(--glass);display:grid;place-items:center;padding:0;flex:none}
.q{font-weight:300;font-size:clamp(34px,9.5vw,58px);line-height:1;letter-spacing:-.04em;text-wrap:balance}
.q small{display:block;font-size:15px;letter-spacing:0;color:var(--muted);font-weight:400;margin-top:12px;line-height:1.45}

/* campos */
.field{display:grid;gap:8px}
.field>span{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.inp,.ta{width:100%;border-radius:18px;border:1px solid var(--edge-2);background:rgb(255 255 255 / .06);padding:14px 16px;outline:0;font-size:16px}
.ta{min-height:130px;resize:vertical;line-height:1.5}
.inp:focus,.ta:focus{border-color:var(--c);box-shadow:0 0 0 3px rgb(255 106 26 / .2)}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{min-height:44px;padding:0 16px;border-radius:var(--pill);border:1px solid var(--edge-2);background:var(--glass)}
.pick button[aria-pressed="true"]{background:var(--text);color:var(--on-light);border-color:transparent}
.choice{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
.choice button{min-height:120px;text-align:left;padding:16px;border-radius:22px;border:1px solid var(--edge-2);background:rgb(255 255 255 / .07);display:grid;align-content:space-between;gap:10px}
.choice button[aria-pressed="true"]{background:var(--text);color:var(--on-light)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:12px;border:1px solid var(--edge-2)}
.drop{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;border:1px dashed var(--edge-2);background:rgb(255 255 255 / .03);cursor:pointer;min-height:56px}

/* aula */
.lesson{display:grid;gap:14px}
.idea{font-weight:300;font-size:clamp(24px,6.4vw,34px);line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
.steps{display:grid;gap:10px;counter-reset:s}
.step{padding:16px;border-radius:20px;background:var(--glass);border:1px solid var(--edge);display:grid;gap:6px}
.step b{font-weight:600}
.step p,.lesson p{color:#D8DBE6;line-height:1.6}
.ex{padding:16px;border-radius:20px;background:linear-gradient(160deg,rgb(110 155 255 / .14),rgb(255 255 255 / .03));border:1px solid var(--edge-2)}
.ex pre{white-space:pre-wrap;font:14px/1.6 var(--mono);margin:8px 0 0;color:#E6E8F0}
.tag{display:inline-block;font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.links{display:grid;gap:8px}
.links a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--glass);border:1px solid var(--edge);text-decoration:none;min-height:52px}
.links a .yt{width:30px;height:30px;border-radius:9px;background:#FF3D3D;display:grid;place-items:center;flex:none;color:#fff}
.links a .rs{width:30px;height:30px;border-radius:9px;background:var(--glass-2);display:grid;place-items:center;flex:none}

/* prova */
.mcq{display:grid;gap:10px;padding:16px;border-radius:22px;background:var(--glass);border:1px solid var(--edge)}
.mcq .p{font-weight:500;font-size:17px;line-height:1.35}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;min-height:48px;padding:12px 14px;border-radius:16px;border:1px solid var(--edge-2);background:rgb(255 255 255 / .04)}
.opt .k{width:26px;height:26px;border-radius:50%;border:1px solid var(--edge-2);display:grid;place-items:center;font:500 12px var(--mono);flex:none}
.opt[aria-pressed="true"]{border-color:var(--text);background:rgb(255 255 255 / .12)}
.opt.right{border-color:var(--ok);background:rgb(94 230 160 / .12)}
.opt.wrong{border-color:var(--bad);background:rgb(255 107 129 / .12)}
.explain{font-size:14px;color:#D8DBE6;padding:10px 12px;border-radius:12px;background:rgb(255 255 255 / .05)}
.score{font:400 clamp(72px,24vw,120px)/1 var(--dot)}

/* timer */
.timer{width:min(76vw,300px);aspect-ratio:1;margin:8px auto;border-radius:50%;display:grid;place-items:center;--p:0;
  background:radial-gradient(closest-side,#07080D 88%,transparent 89% 100%),conic-gradient(var(--g1,var(--c)) calc(var(--p)*1%),rgb(255 255 255 / .08) 0)}
.timer b{font:400 clamp(48px,15vw,72px)/1 var(--dot)}

/* cartas (referência 1) */
.fan{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 4px 18px;margin:0 -4px;scrollbar-width:none}
.fan::-webkit-scrollbar{display:none}
.card{scroll-snap-align:center;flex:0 0 min(64vw,240px);aspect-ratio:3/4;border-radius:26px;padding:18px;display:grid;align-content:space-between;text-align:left;border:1px solid rgb(255 255 255 / .2);
  background:radial-gradient(100% 70% at 80% 20%,var(--g1),transparent 70%),linear-gradient(165deg,var(--g2),#07080D 90%);transition:transform .3s var(--ease);position:relative;overflow:hidden}
.card:nth-child(odd){transform:rotate(-2deg)} .card:nth-child(even){transform:rotate(2deg)}
.card:hover,.card:focus-visible{transform:rotate(0) translateY(-6px)}
.card h3{font-weight:500;font-size:26px;line-height:1;letter-spacing:-.02em}
.card .lv{font:400 40px/1 var(--dot)}
.card .shape{position:absolute;right:-30px;top:40px;width:150px;height:150px;border-radius:50%;background:rgb(255 255 255 / .08);border:1px solid rgb(255 255 255 / .14)}

/* segmentos */
.seg{display:flex;gap:4px;padding:4px;border-radius:var(--pill);background:var(--glass);border:1px solid var(--edge);overflow-x:auto;scrollbar-width:none}
.seg button{flex:1 0 auto;min-height:40px;padding:0 14px;border-radius:var(--pill);border:0;background:none;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--on-light)}

/* heatmap (referência 8) */
.heat{display:grid;grid-template-columns:repeat(15,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:rgb(255 255 255 / .06)}
.heat i.l1{background:rgb(255 106 26 / .3)} .heat i.l2{background:rgb(255 106 26 / .6)} .heat i.l3{background:var(--c)}
.heat i.today{outline:1px solid var(--text)}

/* diário (referência 3) */
.months{display:grid;gap:22px}
.month h3{font-weight:300;font-size:clamp(40px,11vw,60px);letter-spacing:-.04em;line-height:1;margin-bottom:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wd{font:500 11px var(--mono);color:var(--faint);text-align:center;padding-bottom:4px}
.cal button{aspect-ratio:1;border-radius:14px;border:1px solid var(--edge);background:var(--glass);display:grid;place-items:center;font-weight:500;padding:0;min-height:40px;position:relative}
.cal button.out{opacity:.25;pointer-events:none;border-style:dashed}
.cal button.p1{background:rgb(255 106 26 / .22)} .cal button.p2{background:rgb(255 106 26 / .5)} .cal button.p3{background:var(--c);color:var(--on-c)}
.cal button.closed::after{content:"";position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:currentColor}
.cal button.today{outline:2px solid var(--text);outline-offset:1px}
.cal button.future{color:var(--faint)}

/* árvore */
.tree{display:grid;gap:14px}
.branch{padding:16px;border-radius:24px;background:var(--glass);border:1px solid var(--edge);display:grid;gap:12px}
.nodes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.node{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:var(--pill);border:1px solid var(--edge-2);background:rgb(255 255 255 / .04);color:var(--faint);font-size:13px}
.node.on{color:var(--on-light);background:var(--g1);border-color:transparent;font-weight:600;box-shadow:0 0 18px color-mix(in srgb,var(--g1) 45%,transparent)}
.node.is-next{color:var(--text);border-style:dashed;border-color:var(--g1)}
.link-l{width:14px;height:1px;background:var(--edge-2)}

/* chat (referência 7) */
.chat{display:grid;gap:12px;align-content:start}
.msg{max-width:86%;padding:12px 14px;border-radius:20px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.msg.me{justify-self:end;background:var(--c);color:var(--on-c);border-bottom-right-radius:6px}
.msg.ai{justify-self:start;background:rgb(255 255 255 / .07);border:1px solid var(--edge);border-bottom-left-radius:6px}
.orb{width:140px;height:140px;border-radius:50%;margin:10px auto;background:radial-gradient(circle at 35% 30%,#FFD2A8,#FF7A1A 45%,#7A1E00 80%);box-shadow:0 0 80px rgb(255 106 26 / .5);animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.05);box-shadow:0 0 120px rgb(255 106 26 / .65)}}
.composer{display:flex;gap:8px;align-items:flex-end;width:100%}
.composer .ta{min-height:52px;max-height:160px;border-radius:26px;padding:14px 18px}
.sugs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.sugs button{flex:none;min-height:40px;padding:0 14px;border-radius:var(--pill);border:1px solid rgb(255 179 122 / .35);background:rgb(255 106 26 / .12);color:#FFD9BD;font-size:13px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translateX(-50%);z-index:90;background:var(--text);color:var(--on-light);padding:10px 16px;border-radius:var(--pill);font-weight:600;font-size:14px;box-shadow:0 10px 30px rgb(0 0 0 / .4);max-width:calc(100vw - 32px)}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted)}
.thinking i{width:8px;height:8px;border-radius:50%;background:var(--c);animation:blink 1s infinite}
.thinking i:nth-child(2){animation-delay:.2s}.thinking i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.2}}
.note{padding:12px 14px;border-radius:16px;border:1px dashed var(--edge-2);color:var(--muted);font-size:14px}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi{padding:14px;border-radius:20px;background:var(--glass);border:1px solid var(--edge);display:grid;gap:4px}
.kpi b{font:400 28px/1 var(--dot)} .kpi span{font-size:12px;color:var(--muted)}
.list{display:grid;gap:8px}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:18px;background:var(--glass);border:1px solid var(--edge);min-height:56px;text-align:left;width:100%}
.item .grow b{display:block;font-weight:500}
.item .grow small{color:var(--muted)}
.tline{display:grid;gap:0}
.tline .ev{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--edge)}
.tline .ev:last-child{border:0}
.tline .ev.done b{color:var(--ok)}
.tline .ev.hot{background:linear-gradient(90deg,rgb(255 106 26 / .14),transparent);border-radius:12px;padding-left:10px}

/* desktop: duas colunas no Hoje */
.hoje-grid{display:flex;flex-direction:column;gap:18px}
.hoje-grid .h-top{order:1}.hoje-grid .h-side{order:2}.hoje-grid .h-tl{order:3}
@media (min-width:980px){
  .hoje-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);grid-template-areas:"top side" "tl side";gap:22px;align-items:start}
  .hoje-grid .h-top{grid-area:top}.hoje-grid .h-side{grid-area:side;grid-row:1 / span 2}.hoje-grid .h-tl{grid-area:tl}
  .side-sticky{position:sticky;top:16px;display:grid;gap:18px}
  .bento{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (min-width:640px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}

const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const today = () => { const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); };
const dayIdx = d => Math.round((d - START)/864e5);
const toMin = s => { const [h,m]=s.split(":").map(Number); return h*60+m; };
const nowMin = () => { const n=new Date(); return n.getHours()*60+n.getMinutes(); };
const MES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const WD = ["DOM","SEG","TER","QUA","QUI","SEX","SÁB"];
const fmtH = s => s.replace(":", "h");
const bkey = b => b.a + "|" + b.l;

const lsGet = k => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch(e) { return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} };
function coll(){ return DB && UID ? DB.collection("data/users/" + UID) : null; }
const qd = {};
function dbPut(key, val){
  const c = coll(); if(!c) return;
  clearTimeout(qd[key]);
  qd[key] = setTimeout(() => { c.doc(key).set(JSON.parse(JSON.stringify(val))).catch(()=>{}); }, 600);
}
function saveMain(){ lsSet("cav:main", M); dbPut("main", M); }
function day(dstr){ return DAYS[dstr] || (DAYS[dstr] = {blocks:{}, final:null}); }
function saveDay(dstr){ lsSet("cav:d:"+dstr, DAYS[dstr]); dbPut("d_"+dstr, {...DAYS[dstr], date:dstr}); }

async function boot(){
  const lm = lsGet("cav:main"); if(lm) M = Object.assign(M, lm);
  for(let i=0;i<TOTAL;i++){ const k=iso(addDays(START,i)); const v=lsGet("cav:d:"+k); if(v) DAYS[k]=v; }
  render();
  if(!window.claude || !claude.use) return;
  try{
    const u = await claude.use("user");
    if(u){ try{ UID = await u.id(); }catch(e){} }
    DB = await claude.use("db");
    const c = coll();
    if(c){
      const timer = setTimeout(()=>{}, 10000);
      const s = await c.doc("main").get().catch(()=>null);
      if(s && s.exists){ M = Object.assign(M, s.data()); }
      else if(lm) saveMain();
      const q = await c.get().catch(()=>null);
      if(q) q.docs.forEach(x => { const v=x.data(); if(v && v.date){ const o={...v}; delete o.date; DAYS[v.date]=o; } });
      clearTimeout(timer);
      render();
    }
  }catch(e){}
  try{
    SAMPLE = await claude.use("sample");
    if(SAMPLE) LIMITS = await SAMPLE.limits().catch(()=>null);
    ASSETS = await claude.use("assets");
    DL = await claude.use("downloads");
  }catch(e){}
  render();
}

/* ====================================================================
   CÁLCULOS
   ==================================================================== */
function phaseOf(d){ const s=iso(d); return PHASES.find(p => s>=p.a && s<=p.b) || null; }
function blocksOf(d){ return WEEK[d.getDay()].b; }
function kindOf(b){
  if(b.c==="rev") return /integral/.test(b.l) ? "final" : /espaçada/.test(b.l) ? "revisao" : "simples";
  if(b.c==="biblia") return "biblia";
  if(["grad","tech","anbima"].includes(b.c)) return "estudo";
  if(b.c==="pausa") return "pausa";
  return "simples";
}
function dayStats(dstr){
  const d = fromIso(dstr), bs = blocksOf(d), rec = (DAYS[dstr]||{}).blocks || {};
  const relevant = bs.filter(b => !["final","pausa"].includes(kindOf(b)));
  const done = relevant.filter(b => rec[bkey(b)] && rec[bkey(b)].st==="feito").length;
  return {done, total:relevant.length, pct: relevant.length ? done/relevant.length : 0, closed: !!((DAYS[dstr]||{}).final && DAYS[dstr].final.closed)};
}
function allStudy(){
  const out=[];
  Object.entries(DAYS).forEach(([d,v]) => Object.entries(v.blocks||{}).forEach(([k,r]) => { if(r.st==="feito" && r.mat) out.push({d,k,...r}); }));
  (M.livres||[]).forEach(r => out.push(r));
  return out;
}
function countBy(mat){ return allStudy().filter(r => r.mat===mat && (r.score==null || r.score>=0.6)).length; }
function levelOf(mat){ const s=SUBJ[mat], n=countBy(mat); let l=0; s.st.forEach((t,i)=>{ if(n>=t) l=i; }); return {l, n, next:s.st[l+1]}; }
function streak(){
  let s=0, d=today();
  if(dayStats(iso(d)).pct<0.5) d=addDays(d,-1);
  while(dayIdx(d)>=0 && dayStats(iso(d)).pct>=0.5){ s++; d=addDays(d,-1); }
  return s;
}
function quizAvg(){ const q=allStudy().filter(r=>r.score!=null); return q.length ? q.reduce((a,r)=>a+r.score,0)/q.length : null; }
function dueReviews(){ const t=iso(today()); return (M.revisoes||[]).filter(r => !r.done && r.due<=t); }
function addXP(n){ M.xp=(M.xp||0)+n; saveMain(); }
const LEVEL = () => Math.floor((M.xp||0)/250)+1;

function evoPanorama(){
  const t=today(), di=Math.max(0,dayIdx(t)), all=allStudy();
  let heat="", closed=0, hoursByArea={};
  for(let i=0;i<TOTAL;i++){ const s=iso(addDays(START,i)), st=dayStats(s); if(st.closed) closed++;

function openSheet(bg){ if(SH.hidden) OPENER=document.activeElement; SH.style.setProperty("--sbg", bg || "linear-gradient(170deg,#1A0C05,#05060A 55%)"); SH.hidden=false; document.body.style.overflow="hidden";

function closeSheet(){ if(FLOW&&FLOW.timer) clearInterval(FLOW.timer); if(FLOW&&FLOW.ctl) FLOW.ctl.abort(); FLOW=null; try{speechSynthesis.cancel()}catch(e){}
  if(RETURN){ const r=RETURN; RETURN=null; FLOW=r; r.refresh(); openSheet(r.bg); drawFinal(); return; }

function sheetHTML({title, body, steps, at, next, nextOk=true, back=true}){

function pickFiles(){ return new Promise(ok => { const f=$("#filepick"); f.value=""; f.onchange=()=>ok([...f.files]); f.click(); }); }
function loadImg(file){ return new Promise((ok,no)=>{ const u=URL.createObjectURL(file), i=new Image(); i.onload=()=>{URL.revokeObjectURL(u); ok(i)}; i.onerror=no; i.src=u; }); }
function scale(img,max){ const r=Math.min(1,max/Math.max(img.width,img.height)), c=document.createElement("canvas"); c.width=Math.round(img.width*r); c.height=Math.round(img.height*r); c.getContext("2d").drawImage(img,0,0,c.width,c.height); return c; }
async function prepPhotos(files){
  const out={blobs:[],thumbs:[]}, mx=(LIMITS&&LIMITS.images&&LIMITS.images.maxCount)||3;
  for(const f of files.slice(0,mx)){ try{ const img=await loadImg(f), big=scale(img,1400), sm=scale(img,160);
    const b=await new Promise(r=>big.toBlob(r,"image/jpeg",.82)); if(b){ out.blobs.push(b); out.thumbs.push(sm.toDataURL("image/jpeg",.6)); } }catch(e){} }
  return out;
}

function findBlock(dstr,k){ return blocksOf(fromIso(dstr)).find(b=>bkey(b)===k); }
function openBlock(dstr,k){
  const b = findBlock(dstr,k); if(!b) return;
  const kd = kindOf(b);
  if(kd==="simples"||kd==="pausa") return openSimple(dstr,b);
  if(kd==="final") return openFinal();
  if(kd==="revisao") return openReviews();
  const r = day(dstr).blocks[k];
  if(r && r.st) return openRecord(dstr,b,r);
  openStudy({dstr, b, mat: FROM_LABEL(b.l) || (b.c==="anbima"?"anbima":b.c==="tech"?"py":"mat")});
}
function openStudy({dstr, b, mat, topic, livre}){
  const isBib = (b && b.c==="biblia") || mat==="biblia";
  const area = b ? b.c : (SUBJ[mat]?SUBJ[mat].a:"grad");
  FLOW = {kind:"study", dstr, b, mat, livre, isBib, at:0, data:{topic:topic||"", fonte:"", link:"", fotos:[], thumbs:[], notes:"", conta:"", aula:null, quiz:null, ans:{}, aberta:"", t0:Date.now()}};
  FLOW.steps = isBib ? ["plano","conta","prova","fim"] : ["plano","aula","foco","conta","prova","fim"];
  FLOW.next = () => stepStudy(+1); FLOW.back = () => stepStudy(-1);
  openSheet(`radial-gradient(120% 60% at 100% 0%,color-mix(in srgb,${g1(area)} 35%,transparent),transparent 60%),linear-gradient(170deg,color-mix(in srgb,${g2(area)} 70%,#05060A),#05060A 60%)`);
  SH.style.setProperty("--g1", g1(area));
  if(topic) FLOW.at = 0;
  drawStudy();
}
function stepStudy(d){
  const F=FLOW; const cur=F.steps[F.at];
  if(d>0){
    if(cur==="plano"){ const t=$("#st-topic"); if(t) F.data.topic=t.value.trim(); const l=$("#st-link"); if(l) F.data.link=l.value.trim(); }
    if(cur==="foco"){ const n=$("#st-notes"); if(n) F.data.notes=n.value; if(F.timer) clearInterval(F.timer); }
    if(cur==="conta"){ const c=$("#st-conta"); if(c) F.data.conta=c.value.trim(); }
    if(cur==="prova"){ return gradeQuiz(); }
    if(cur==="fim"){ return closeSheet(); }
  }
  F.at = Math.max(0, Math.min(F.steps.length-1, F.at+d));
  drawStudy();
}

      ${!aiOn()?`<p class="note">O Claude não está ligado nesta cópia. A aula e a prova automáticas aparecem na versão publicada. Aqui você ainda registra o estudo e a descrição.</p>`:""}

function tickFocus(){

}

async function genLesson(){

Matéria: ${mat}. Nível atual na trilha: ${SUBJ[F.mat]?SUBJ[F.mat].lv[lv.l]:"-"}. Assunto informado: "${D.topic||"(não informado: escolha o próximo tópico lógico da trilha)"}". Fonte: ${D.fonte||"-"}. ${D.link?"Link: "+D.link:""}
${D.fotos.length?"As imagens anexadas são o material que será estudado (página, slide ou exercício). Baseie a aula nelas.":""}
Regras do laudo: explicar o PORQUÊ, partir do concreto para o abstrato, mostrar um exemplo resolvido passo a passo com verificação, e terminar com treino graduado.
Responda só com JSON neste formato:
{"titulo":"nome curto do assunto","ideia":"a ideia central em 1–2 frases","analogia":"comparação concreta do dia a dia","passos":[{"t":"título curto","txt":"explicação em 2–3 frases"}],"exemplo":{"enunciado":"...","resolucao":"passo a passo em linhas, com a verificação no final"},"armadilhas":["erro comum 1","erro comum 2"],"treino":["exercício guiado","exercício independente","problema contextualizado"],"buscas":["busca no YouTube em português 1","busca 2","busca 3"]}
Use 3 a 5 passos. As buscas devem ser frases de pesquisa (não links).`;

}
async function genQuiz(){
  const F=FLOW, D=F.data, mat=SUBJ[F.mat]?SUBJ[F.mat].n:F.mat;
  F.ctl=new AbortController();
  const n = F.isBib ? 2 : 4;
  const prompt = `Crie uma PROVA para confirmar que o estudo foi feito e entendido.
Matéria: ${mat}. Assunto: "${D.topic}". ${D.aula?"Ideia central da aula: "+D.aula.ideia:""}
O que a pessoa escreveu que aprendeu (use isso, inclusive para corrigir equívocos): """${D.conta.slice(0,3000)}"""
${D.notes?"Anotações dela: "+D.notes.slice(0,1500):""}
Faça ${n} questões de múltipla escolha (4 alternativas, só uma certa, nível de quem acabou de estudar, pelo menos uma de aplicação em situação nova) e 1 pergunta aberta curta que peça para explicar o porquê.
${F.isBib?"Para Bíblia: perguntas sobre o texto lido e a aplicação, sem inventar versículos; se não souber o texto exato, pergunte sobre o que ela escreveu.":""}
Responda só com JSON: {"qs":[{"p":"pergunta","o":["A","B","C","D"],"c":0,"e":"explicação curta de por que a certa está certa"}],"aberta":{"p":"pergunta","criterio":"o que uma boa resposta precisa conter"}}`;
  try{
    D.quiz = await aiJson(prompt, {signal:F.ctl.signal});
    if(!D.quiz || !Array.isArray(D.quiz.qs)) throw {code:"invalid_json"};
    if(FLOW===F && F.steps[F.at]==="prova"){ $("#prova").innerHTML = quizHTML(D.quiz,D.ans,false); bindQuiz(); }
  }catch(e){ if(e.code==="cancelled") return; const el=$("#prova"); if(el) el.innerHTML=`<p class="note">${esc(aiErr(e))}</p><div class="row wrap"><button class="btn sm" data-act="quiz-retry">Tentar de novo</button><button class="btn sm ghost" data-act="aceitar-sem-prova">Concluir sem prova</button></div>`;

function quizHTML(Q, ans, show){
  const K="ABCD";
  return Q.qs.map((q,i)=>`<div class="mcq"><span class="tag">Questão ${i+1} de ${Q.qs.length+1}</span><p class="p">${esc(q.p)}</p>
    ${q.o.map((o,j)=>{ let cls=""; if(show){ if(j===q.c) cls="right"; else if(ans[i]===j) cls="wrong"; }
      return `<button class="opt ${cls}" data-q="${i}" data-o="${j}" aria-pressed="${ans[i]===j}" ${show?"disabled":""}><span class="k">${K[j]}</span><span>${esc(o)}</span></button>`; }).join("")}
    ${show?`<p class="explain">${esc(q.e||"")}</p>`:""}</div>`).join("") +
    (show?"":`<div class="mcq"><span class="tag">Questão ${Q.qs.length+1} de ${Q.qs.length+1} · aberta</span><p class="p">${esc(Q.aberta.p)}</p><label class="sr" for="st-aberta">Sua resposta</label><textarea class="ta" id="st-aberta" placeholder="Explique com as suas palavras">${esc(FLOW.data.aberta)}</textarea></div>`);
}
function bindQuiz(){
  const F=FLOW, D=F.data, upd=()=>{ const ok=D.quiz.qs.every((q,i)=>D.ans[i]!=null) && (D.aberta||"").trim().length>=20; SH.querySelector('[data-sh="next"]').disabled=!ok; };
  $("#prova").addEventListener("click", e => { const b=e.target.closest(".opt"); if(!b||b.disabled) return; const i=+b.dataset.q; D.ans[i]=+b.dataset.o;
    b.parentElement.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed", String(x===b))); upd(); });
  const ta=$("#st-aberta"); if(ta) ta.addEventListener("input", e=>{ D.aberta=e.target.value; upd(); });
  upd();
}
async function gradeQuiz(){
  const F=FLOW, D=F.data, Q=D.quiz; const ta=$("#st-aberta"); if(ta) D.aberta=ta.value;
  const right = Q.qs.filter((q,i)=>D.ans[i]===q.c).length;
  F.at = F.steps.indexOf("fim"); D.result=null; drawStudy();
  let open = {nota:0.5, feedback:""};
  try{
    open = await aiJson(`Corrija a resposta aberta. Pergunta: "${Q.aberta.p}". Critério: "${Q.aberta.criterio}". Resposta: """${D.aberta.slice(0,2000)}""". Seja justo e encorajador; aponte o que faltou. Responda só com JSON: {"nota":0.0 a 1.0,"feedback":"2–3 frases"}`, {modelTier:"quick"});
  }catch(e){ open = {nota:0.5, feedback:"Não consegui corrigir a pergunta aberta agora; contei meio ponto."}; }
  const score = (right + Math.max(0,Math.min(1,+open.nota||0))) / (Q.qs.length+1);
  Q.qs.forEach((q,i)=>{ if(D.ans[i]!==q.c){ (M.erros=M.erros||[]).push({id:"e"+Date.now()+i, d:iso(today()), mat:F.mat, p:q.p, minha:q.o[D.ans[i]]||"", certa:q.o[q.c], e:q.e, ok:false}); } });
  const pass = score >= 0.6;
  D.result = {score, pass, feedback:open.feedback, xp: pass?Math.round(20+score*20):0,
    msg: pass ? (score>=0.9?"Excelente. Domínio demonstrado.":"Bloco confirmado. O que errou foi para o caderno de erros.") : "Ainda abaixo de 60%. Releia a aula e o caderno de erros e faça outra prova. Aprender é isso."};
  if(pass) saveStudy(score); else saveMain();
  if(FLOW===F) drawStudy();
}

}

const STEPS = [1,3,7,14,30];
function openReviews(){
  const due = dueReviews();
  if(!due.length){ toast("Nenhuma revisão vencida hoje."); return; }
  openReview(due[0].id);
}
function openReview(id){
  const r=(M.revisoes||[]).find(x=>x.id===id); if(!r) return;
  let Q=null, ans={};
  FLOW={kind:"rev", next:async()=>{ if(!Q){ closeSheet(); return; }
      const right=Q.qs.filter((q,i)=>ans[i]===q.c).length, sc=right/Q.qs.length;
      const i=STEPS.indexOf(STEPS.find(s=>s>=r.step)); r.done=true;
      if(sc>=0.67 && i<STEPS.length-1){ (M.revisoes).push({...r, id:"r"+Date.now(), step:STEPS[i+1], due:iso(addDays(today(),STEPS[i+1]-STEPS[i])), done:false}); }
      else if(sc<0.67){ (M.revisoes).push({...r, id:"r"+Date.now(), step:1, due:iso(addDays(today(),1)), done:false}); }
      Q.qs.forEach((q,j)=>{ if(ans[j]!==q.c) (M.erros=M.erros||[]).push({id:"e"+Date.now()+j, d:iso(today()), mat:r.mat, p:q.p, minha:q.o[ans[j]]||"", certa:q.o[q.c], e:q.e, ok:false}); });
      addXP(Math.round(10*sc)+5); saveMain();
      SH.querySelector("#rv").innerHTML = `<div style="text-align:center"><div class="score">${Math.round(sc*100)}%</div><p class="title-m">${sc>=0.67?`Fixou. Próxima revisão em ${STEPS[Math.min(i+1,STEPS.length-1)]-STEPS[i]} dias.`:"Ainda escapando. Volta amanhã, e os erros foram para o caderno."}</p></div>` + quizHTML(Q,ans,true).replace(/<div class="mcq"><span class="tag">Questão \d+ de \d+ · aberta[\s\S]*$/,"");
      Q=null; SH.querySelector('[data-sh="next"]').firstChild.textContent="Fechar "; }, back:()=>{}};
  openSheet("linear-gradient(170deg,#101540,#05060A 60%)");
  sheetHTML({title:`Revisão D${r.step} · ${SUBJ[r.mat]?SUBJ[r.mat].n:""}`, next:"Corrigir", nextOk:false, body:`
    <h2 class="q" style="font-size:clamp(30px,8vw,44px)">${esc(r.topic)}<small>Recuperação ativa: responda sem consultar o caderno. É assim que a memória se fortalece.</small></h2><div id="rv">${aiOn()?thinking("Preparando 3 perguntas…"):`<p class="note">Sem o Claude nesta cópia. Escreva no caderno o que lembra de "${esc(r.topic)}" e depois confira.</p>`}</div>`});
  if(!aiOn()){ SH.querySelector('[data-sh="next"]').disabled=false; FLOW.next=()=>{ r.done=true; (M.revisoes).push({...r,id:"r"+Date.now(),step:STEPS[Math.min(STEPS.indexOf(r.step)+1,4)],due:iso(addDays(today(),3)),done:false}); saveMain(); closeSheet(); }; return; }
  aiJson(`Revisão espaçada (dia ${r.step}) do assunto "${r.topic}" (${SUBJ[r.mat]?SUBJ[r.mat].n:""}). O que a pessoa tinha escrito quando estudou: """${(r.conta||"").slice(0,800)}""". Faça 3 questões de múltipla escolha de RECUPERAÇÃO (lembrar e aplicar, não reconhecer), 4 alternativas. Responda só com JSON: {"qs":[{"p":"","o":["","","",""],"c":0,"e":""}]}`, {modelTier:"quick"})
   .then(q=>{ Q={...q, aberta:{p:""}}; const el=$("#rv"); if(!el) return; el.innerHTML = Q.qs.map((q,i)=>`<div class="mcq"><span class="tag">Pergunta ${i+1} de ${Q.qs.length}</span><p class="p">${esc(q.p)}</p>${q.o.map((o,j)=>`<button class="opt" data-q="${i}" data-o="${j}" aria-pressed="false"><span class="k">${"ABCD"[j]}</span><span>${esc(o)}</span></button>`).join("")}</div>`).join("");
     el.addEventListener("click", e=>{ const b=e.target.closest(".opt"); if(!b||b.disabled) return; ans[+b.dataset.q]=+b.dataset.o; b.parentElement.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); SH.querySelector('[data-sh="next"]').disabled = Q.qs.some((q,i)=>ans[i]==null); }); })
   .catch(e=>{ const el=$("#rv"); if(el) el.innerHTML=`<p class="note">${esc(aiErr(e))}</p>`; });
}

/* ====================================================================
   FINALIZAR O DIA: pendências → recordar → resumo → nota → síntese → gratidão
   ==================================================================== */
function openFinal(){
  const dstr=iso(today()), Dy=day(dstr);
  if(Dy.final && Dy.final.closed) return openDay(dstr);
  const bs=blocksOf(today()), rec=Dy.blocks;
  const fb = bs.find(b=>kindOf(b)==="final");
  if(fb && nowMin() < toMin(fb.a)-90 && !openFinal.ok){
    FLOW={kind:"confirm", next:()=>{ openFinal.ok=true; closeSheetSoft(); openFinal(); openFinal.ok=false; }, back:()=>{}};
    openSheet("linear-gradient(170deg,#0D0A2A,#05060A 60%)");
    sheetHTML({title:"Finalizar o dia", next:"Finalizar mesmo assim", body:`<h2 class="q">Ainda é cedo<small>A revisão integral de hoje é às ${fmtH(fb.a)}. Finalizar agora encerra o dia com os blocos que faltam. Se for isso mesmo, siga.</small></h2>`});
    return;
  }
  const pend = bs.filter(b=>!rec[bkey(b)] && !["final","pausa"].includes(kindOf(b)) && !/Oração antes de dormir/.test(b.l) && toMin(b.b)<=nowMin());
  const feitos = bs.filter(b=>rec[bkey(b)] && rec[bkey(b)].st==="feito" && rec[bkey(b)].mat).map(b=>({b, r:rec[bkey(b)]}));
  const F = FLOW = {kind:"final", at:0, steps:["pendencias","recordar","resumo","nota","sintese","gratidao"], pend, feitos, data:{motivos:{}, recall:null, rans:{}, resumos:{}, geral:"", nota:null, f1:"", f2:"", f3:"", sint:null, grato:false}};
  F.bg="radial-gradient(120% 60% at 50% 0%,rgb(110 90 255 / .35),transparent 60%),linear-gradient(170deg,#0D0A2A,#05060A 60%)";
  F.refresh=()=>{ const r2=day(dstr).blocks; F.pend=F.pend.filter(b=>!r2[bkey(b)]); F.feitos=bs.filter(b=>r2[bkey(b)]&&r2[bkey(b)].st==="feito"&&r2[bkey(b)].mat).map(b=>({b,r:r2[bkey(b)]})); };
  F.next=()=>stepFinal(+1); F.back=()=>stepFinal(-1);
  F.pick=(g,v)=>{ if(g.startsWith("pm-")){ F.data.motivos[g.slice(3)]=v; } };
  openSheet("radial-gradient(120% 60% at 50% 0%,rgb(110 90 255 / .35),transparent 60%),linear-gradient(170deg,#0D0A2A,#05060A 60%)");
  drawFinal();
}
function stepFinal(d){
  const F=FLOW, D=F.data, s=F.steps[F.at];
  if(d>0){
    if(s==="resumo"){ F.feitos.forEach((x,i)=>{ const t=$("#rs-"+i); if(t) D.resumos[i]=t.value.trim(); }); D.geral=($("#rs-g")||{}).value||""; }
    if(s==="nota"){ D.nota=+$("#nt").value; D.f1=$("#f1").value; D.f2=$("#f2").value; D.f3=$("#f3").value; }
    if(s==="gratidao"){ return closeDay(); }
  }
  F.at=Math.max(0,Math.min(F.steps.length-1,F.at+d)); drawFinal();
}
function drawFinal(){
  const F=FLOW, D=F.data, s=F.steps[F.at], S=F.steps.length, title="Finalizar o dia";
  if(s==="pendencias"){
    sheetHTML({title, steps:S, at:F.at, next:"Próximo", body:`
      <h2 class="q">Antes de fechar<small>${F.pend.length?`Ficaram ${F.pend.length} bloco(s) sem registro. Diga o motivo de cada um, ou toque no bloco para confirmar se fez.`:"Todos os blocos têm registro. Muito bem."}</small></h2>
      ${F.pend.map((b,i)=>`<div class="glass pad" style="display:grid;gap:10px"><div class="row"><span class="grow"><b style="font-weight:500">${esc(b.l)}</b><br><span class="muted mono" style="font-size:12px">${fmtH(b.a)}–${fmtH(b.b)}</span></span><button class="btn sm" data-act3="fiz" data-i="${i}">Eu fiz</button></div><div class="pick" data-pick="pm-${i}">${MOTIVOS.map(m=>`<button data-v="${m}" aria-pressed="${D.motivos[i]===m}">${m}</button>`).join("")}</div></div>`).join("")}`});
    SH.querySelectorAll('[data-act3="fiz"]').forEach(btn=>btn.addEventListener("click",()=>{ const b=F.pend[+btn.dataset.i]; RETURN=F; closeSheetSoft(); openBlock(iso(today()),bkey(b)); }));
    return;
  }
  if(s==="recordar"){
    if(!F.feitos.length || !aiOn()){ sheetHTML({title, steps:S, at:F.at, next:"Próximo", body:`<h2 class="q">Recordar<small>${!F.feitos.length?"Nenhum bloco de estudo foi confirmado hoje, então não há o que recordar.":"Sem o Claude nesta cópia. Feche os olhos e lembre de cada assunto do dia antes de seguir."}</small></h2>`}); return; }
    sheetHTML({title, steps:S, at:F.at, next:"Próximo", nextOk:!!D.recall, body:`<h2 class="q">Lembra disso?<small>Uma pergunta para cada assunto de hoje, em ordem aleatória. Responda sem consultar.</small></h2><div id="rc">${D.recall?recallHTML():thinking("Preparando as perguntas do dia…")}</div>`});
    if(!D.recall) aiJson(`Fim do dia. Para cada estudo abaixo, faça 1 pergunta de múltipla escolha curta para recordar o principal (4 alternativas). Embaralhe a ordem. Estudos: ${JSON.stringify(F.feitos.map(x=>({assunto:x.r.topic, materia:SUBJ[x.r.mat]?SUBJ[x.r.mat].n:"", escreveu:(x.r.conta||"").slice(0,400)})))}. Responda só com JSON: {"qs":[{"assunto":"","p":"","o":["","","",""],"c":0,"e":""}]}`, {modelTier:"quick"})
      .then(q=>{ D.recall=q; if(FLOW===F&&F.steps[F.at]==="recordar") drawFinal(); }).catch(e=>{ const el=$("#rc"); if(el) el.innerHTML=`<p class="note">${esc(aiErr(e))}</p>`; SH.querySelector('[data-sh="next"]').disabled=false; });
    else bindRecall();
    return;
  }
  if(s==="resumo"){
    sheetHTML({title, steps:S, at:F.at, next:"Próximo", body:`<h2 class="q">Com as suas palavras<small>O que você fez em cada atividade de hoje? Curto e honesto.</small></h2>
      ${F.feitos.map((x,i)=>`<label class="field"><span>${esc(x.b.l)} · ${esc(x.r.topic||"")}</span><textarea class="ta" id="rs-${i}" style="min-height:90px">${esc(D.resumos[i]||"")}</textarea></label>`).join("")}
      <label class="field"><span>Bíblia, ministério e o que aprendi hoje</span><textarea class="ta" id="rs-g" style="min-height:110px" placeholder="Livro que li, o que aprendi, o que pratiquei">${esc(D.geral)}</textarea></label>`});
    return;
  }
  if(s==="nota"){
    sheetHTML({title, steps:S, at:F.at, next:"Gerar meu resumo", nextOk:D.nota!=null, body:`<h2 class="q">Que nota o dia merece?<small>Arraste ou toque na barra.</small></h2>
      <div style="text-align:center"><output class="score" id="nto">${D.nota==null?"–":D.nota}</output></div>
      <label class="sr" for="nt">Nota de 0 a 10</label><input type="range" id="nt" min="0" max="10" step="1" value="${D.nota==null?5:D.nota}" style="width:100%;accent-color:var(--c);height:44px">
      <label class="field"><span>1 · O que aprendi</span><input class="inp" id="f1" value="${esc(D.f1)}"></label>
      <label class="field"><span>2 · Onde errei ou travei</span><input class="inp" id="f2" value="${esc(D.f2)}"></label>
      <label class="field"><span>3 · Prioridade de amanhã</span><input class="inp" id="f3" value="${esc(D.f3)}"></label>`});
    $("#nt").addEventListener("input",e=>{ $("#nto").textContent=e.target.value; D.nota=+e.target.value; SH.querySelector('[data-sh="next"]').disabled=false; });
    return;
  }
  if(s==="sintese"){
    sheetHTML({title, steps:S, at:F.at, next:"Próximo", nextOk:!!D.sint||!aiOn(), body:`<div id="sn">${D.sint?sintHTML(D.sint):aiOn()?thinking("O Claude está organizando o seu dia…"):`<p class="note">Sem o Claude nesta cópia, o resumo técnico aparece na versão publicada.</p>`}</div>`});
    if(!D.sint && aiOn()) genSintese();
    return;
  }
  if(s==="gratidao"){
    sheetHTML({title, steps:S, at:F.at, next:"Registrar o dia", nextOk:D.grato, body:`
      <div class="orb" style="background:radial-gradient(circle at 35% 30%,#FFF1D6,#FFB547 45%,#7A2E0E 85%);box-shadow:0 0 80px rgb(255 181 71 / .45)"></div>
      <h2 class="q" style="text-align:center">Agora, ore e agradeça<small style="text-align:center">Entregue o dia a Deus. Quando terminar, marque abaixo e registre.</small></h2>
      <button class="btn ${D.grato?"primary":""}" id="gr" style="justify-self:center;min-height:56px"><svg class="icon"><use href="#i-check"/></svg>Agradeci a Deus pelo dia</button>`});
    $("#gr").addEventListener("click",()=>{ D.grato=!D.grato; drawFinal(); });
  }
}
function closeSheetSoft(){ if(FLOW&&FLOW.ctl) FLOW.ctl.abort(); FLOW=null; }
function recallHTML(){ const F=FLOW, Q=F.data.recall; return Q.qs.map((q,i)=>`<div class="mcq"><span class="tag">${esc(q.assunto||"")}</span><p class="p">${esc(q.p)}</p>${q.o.map((o,j)=>{ const a=F.data.rans[i]; const cls=a==null?"":j===q.c?"right":a===j?"wrong":""; return `<button class="opt ${cls}" data-q="${i}" data-o="${j}" ${a!=null?"disabled":""}><span class="k">${"ABCD"[j]}</span><span>${esc(o)}</span></button>`; }).join("")}${F.data.rans[i]!=null?`<p class="explain">${esc(q.e||"")}</p>`:""}</div>`).join(""); }

Responda só com JSON: {"titulo":"frase-título do dia","blocos":[{"area":"Bíblia|Matemática|Economia|Dados|ANBIMA|Ministério","resumo":"2–3 frases"}],"tecnica":["reforço técnico 1","2","3"],"objetivo":"2 frases sobre o avanço rumo à meta","mensagem":"1–2 frases finais"}`, {signal:F.ctl.signal});

/* ---------- um dia do diário ---------- */
function openDay(dstr){

  SH.querySelectorAll('[data-act5="rec"]').forEach(b=>b.addEventListener("click",()=>{ const bl=bs.find(x=>bkey(x)===b.dataset.k); closeSheetSoft(); openRecord(dstr,bl,Dy.blocks[b.dataset.k]); }));

}

  sheetHTML({title:AREAS[s.a].n, next:"Estudar agora", body:`
    <h2 class="q">${esc(s.n)}<small>Nível ${["I","II","III","IV","V"][L.l]} · ${esc(s.lv[L.l])} · ${L.n} blocos aprovados${L.next!=null?` · faltam ${L.next-L.n} para o próximo nível`:""}</small></h2>
    <div class="steps">${s.lv.map((x,i)=>`<div class="step" style="${i===L.l?"border-color:"+g1(s.a):i<L.l?"opacity:.7":""}"><span class="tag">Nível ${["I","II","III","IV","V"][i]} ${i<L.l?"· concluído":i===L.l?"· atual":""}</span><b>${esc(x)}</b></div>`).join("")}</div>
    ${s.rec.length?`<div class="links"><span class="tag">Materiais escolhidos</span>${s.rec.map(([n,u])=>`<a href="${u}" target="_blank" rel="noopener"><span class="rs"><svg class="icon" style="width:14px;height:14px"><use href="#i-link"/></svg></span><span class="grow">${esc(n)}</span><svg class="icon"><use href="#i-arrow"/></svg></a>`).join("")}</div>`:""}
    ${hist.length?`<div class="list"><span class="tag">Últimos estudos</span>${hist.map(r=>`<div class="item"><span class="grow"><b>${esc(r.topic||"")}</b><small>${r.d?fromIso(r.d).getDate()+"/"+(fromIso(r.d).getMonth()+1):""}${r.score!=null?" · "+Math.round(r.score*100)+"%":""}</small></span></div>`).join("")}</div>`:""}`});
}

/* ---------- simulado ANBIMA ---------- */
function openSimulado(){
  if(!aiOn()){ toast("O simulado precisa do Claude ligado (versão publicada)."); return; }
  let Q=null, ans={};
  FLOW={kind:"sim", next:()=>{ if(!Q) return closeSheet();
    const r=Q.qs.filter((q,i)=>ans[i]===q.c).length, sc=r/Q.qs.length; (M.simulados=M.simulados||[]).push({d:iso(today()), score:sc, n:Q.qs.length});
    Q.qs.forEach((q,j)=>{ if(ans[j]!==q.c) (M.erros=M.erros||[]).push({id:"e"+Date.now()+j, d:iso(today()), mat:"anbima", p:q.p, minha:q.o[ans[j]]||"", certa:q.o[q.c], e:q.e, ok:false}); });
    addXP(Math.round(sc*40)); saveMain();
    $("#sm").innerHTML=`<div style="text-align:center"><div class="score">${Math.round(sc*100)}%</div><p class="title-m">${r} de ${Q.qs.length} · ${sc>=.7?"acima da meta de 70%":"meta: 70%. Os erros foram para o caderno."}</p></div>`+Q.qs.map((q,i)=>`<div class="mcq"><p class="p">${esc(q.p)}</p>${q.o.map((o,j)=>`<div class="opt ${j===q.c?"right":ans[i]===j?"wrong":""}"><span class="k">${"ABCD"[j]}</span><span>${esc(o)}</span></div>`).join("")}<p class="explain">${esc(q.e)}</p></div>`).join("");
    Q=null; SH.querySelector('[data-sh="next"]').firstChild.textContent="Fechar "; }, back:()=>{}};
  openSheet("linear-gradient(170deg,#2A2100,#05060A 60%)");
  sheetHTML({title:"Simulado ANBIMA CPA", next:"Corrigir", nextOk:false, body:`<h2 class="q">Simulado<small>10 questões no estilo da certificação, misturando os temas do programa. Sem consultar.</small></h2><div id="sm">${thinking("Montando o simulado…")}</div>`});
  aiJson(`Crie um SIMULADO de 10 questões no estilo da certificação ANBIMA CPA (nível de entrada), cobrindo: Sistema Financeiro Nacional, ética e regulação, noções de economia e finanças, princípios de investimento, fundos e tributação. 4 alternativas, só uma certa, explicação curta. Use conceitos estáveis e evite números de normas que mudam. Responda só com JSON: {"qs":[{"p":"","o":["","","",""],"c":0,"e":""}]}`)
   .then(q=>{ Q=q; const el=$("#sm"); if(!el) return; el.innerHTML=q.qs.map((x,i)=>`<div class="mcq"><span class="tag">${i+1} de ${q.qs.length}</span><p class="p">${esc(x.p)}</p>${x.o.map((o,j)=>`<button class="opt" data-q="${i}" data-o="${j}" aria-pressed="false"><span class="k">${"ABCD"[j]}</span><span>${esc(o)}</span></button>`).join("")}</div>`).join("");
     el.addEventListener("click",e=>{ const b=e.target.closest("button.opt"); if(!b) return; ans[+b.dataset.q]=+b.dataset.o; b.parentElement.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); SH.querySelector('[data-sh="next"]').disabled=q.qs.some((x,i)=>ans[i]==null); }); })
   .catch(e=>{ const el=$("#sm"); if(el) el.innerHTML=`<p class="note">${esc(aiErr(e))}</p>`; });
}

/* ---------- chat C ---------- */
function openChat(prefill){
  M.chat = M.chat || [];
  let ctl=null, imgs=[], thumbs=[];
  FLOW={kind:"chat", next:()=>{}, back:()=>{}};
  openSheet("radial-gradient(120% 70% at 50% 0%,rgb(255 106 26 / .45),transparent 60%),linear-gradient(180deg,#160904,#05060A 60%)");
  const cur = blocksOf(today()).find(b=>nowMin()>=toMin(b.a)&&nowMin()<toMin(b.b));
  const draw = () => {
    SH.innerHTML = `<div class="sh-top"><span class="eyebrow grow">Claude · seu tutor</span>${M.chat.length?`<button class="btn sm ghost" id="ch-clear">Limpar</button>`:""}<button class="x" data-sh="close" aria-label="Fechar"><svg class="icon"><use href="#i-x"/></svg></button></div>
      <div class="sh-body" id="shb">${M.chat.length?"":`<div class="orb"></div><h2 class="q" style="text-align:center">O que vamos estudar agora?<small style="text-align:center">${cur?`Agora: ${esc(cur.l)}. `:""}Pergunte, mande uma foto do exercício ou peça uma estratégia.</small></h2>`}
        <div class="chat" id="chl">${M.chat.map(m=>`<div class="msg ${m.role==="user"?"me":"ai"}">${esc(m.content)}</div>`).join("")}</div></div>
      <div class="sh-foot"><div class="in" style="display:grid;gap:10px">
        <div class="sugs">${["Explique o assunto deste bloco","Monte 5 exercícios graduais","Como estou indo esta semana?","Me ajude a planejar amanhã","Estratégia para lembrar fórmulas"].map(s=>`<button data-sug="${esc(s)}">${esc(s)}</button>`).join("")}</div>
        <div class="thumbs">${thumbs.map(t=>`<img src="${t}" alt="Imagem anexada">`).join("")}</div>
        <form class="composer" id="chf">${canImg()?`<button type="button" class="x" id="ch-img" aria-label="Anexar foto"><svg class="icon"><use href="#i-cam"/></svg></button>`:""}<label class="sr" for="chi">Mensagem</label><textarea class="ta" id="chi" rows="1" placeholder="Pergunte ao Claude">${esc(prefill||"")}</textarea><button class="btn c" style="width:52px;padding:0" aria-label="Enviar"><svg class="icon"><use href="#i-send"/></svg></button></form>
      </div></div>`;
    const bd=$("#shb"); bd.scrollTop=bd.scrollHeight;
    $("#chf").addEventListener("submit", e=>{ e.preventDefault(); send($("#chi").value); });
    $("#chi").addEventListener("keydown", e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); send($("#chi").value); } });
    SH.querySelectorAll("[data-sug]").forEach(b=>b.addEventListener("click",()=>send(b.dataset.sug)));
    $("#ch-img")?.addEventListener("click", async()=>{ const f=await pickFiles(); if(!f.length) return; const p=await prepPhotos(f); imgs=p.blobs; thumbs=p.thumbs; const v=$("#chi").value; draw(); $("#chi").value=v; });
    $("#ch-clear")?.addEventListener("click",()=>{ M.chat=[]; saveMain(); draw(); });
  };
  const send = async (txt) => {
    txt=(txt||"").trim(); if(!txt) return;
    if(!aiOn()){ toast("O chat funciona na versão publicada, com o Claude ligado."); return; }
    M.chat.push({role:"user", content: txt + (thumbs.length?"\n[foto anexada]":"")}); const sendImgs=imgs; imgs=[]; thumbs=[]; draw();
    const box=document.createElement("div"); box.className="msg ai"; box.innerHTML=thinking(""); $("#chl").append(box);
    const hoje = blocksOf(today()).map(b=>{ const r=day(iso(today())).blocks[bkey(b)]; return `${b.a} ${b.l}${r?(r.st==="feito"?" ✓"+(r.topic?" ("+r.topic+")":""):" ✗"):""}`; }).join("; ");
    const ctxTurn = perfil()+`\nAgenda de hoje: ${hoje}. Constância: ${streak()} dias. Média nas provas: ${quizAvg()==null?"-":Math.round(quizAvg()*100)+"%"}. Revisões vencidas: ${dueReviews().map(r=>r.topic).join(", ")||"nenhuma"}. Erros abertos recentes: ${(M.erros||[]).filter(e=>!e.ok).slice(-5).map(e=>e.p).join(" | ")||"nenhum"}.
Você é o tutor dentro do app Caverna. Ensine com perguntas e pistas antes de dar a resposta pronta (a meta é ela pensar sozinha). Respostas curtas e práticas, em texto simples sem markdown pesado.`;
    ctl=new AbortController();
    try{
      const turns=[{role:"user",content:ctxTurn}, ...M.chat.slice(-12)];
      const r=await SAMPLE(turns,{cache:false, signal:ctl.signal, images: sendImgs.length?sendImgs:undefined, onText:({text})=>{ box.textContent=text; const bd=$("#shb"); if(bd) bd.scrollTop=bd.scrollHeight; }});
      M.chat.push({role:"assistant", content:r.text}); M.chat=M.chat.slice(-30); saveMain();
    }catch(e){ box.textContent = e.text || aiErr(e); }
  };
  draw();
  if(prefill) setTimeout(()=>$("#chi")?.focus(),50);
}

/* ---------- perfil ---------- */
function openProfile(){
  FLOW={kind:"perfil", next:()=>{ M.profile.name=$("#pf-n").value.trim()||NAME_DEFAULT; saveMain(); closeSheet(); }, back:()=>{}};
  openSheet();
  sheetHTML({title:"Perfil", next:"Salvar", body:`
    <div style="display:grid;justify-items:center;gap:12px"><button class="avatar" id="pf-ph" style="width:120px;height:120px;font-size:44px" aria-label="Trocar foto">${M.profile.photo?`<img src="${esc(M.profile.photo)}" alt="Sua foto">`:esc((M.profile.name||"E")[0])}</button><span class="muted" style="font-size:13px">Toque para trocar a foto</span></div>
    <label class="field"><span>Nome</span><input class="inp" id="pf-n" value="${esc(M.profile.name||"")}"></label>
    <div class="kpis"><div class="kpi"><b>${LEVEL()}</b><span>nível</span></div><div class="kpi"><b>${M.xp||0}</b><span>XP</span></div><div class="kpi"><b>${allStudy().length}</b><span>estudos</span></div><div class="kpi"><b>${(M.erros||[]).length}</b><span>erros registrados</span></div></div>
    <p class="note">${DB&&UID?"Seus registros ficam salvos na sua conta e aparecem em qualquer aparelho.":"Seus registros ficam salvos neste navegador. Na versão publicada, ficam na sua conta."}</p>
    ${DL?`<button class="btn" id="pf-bk">Baixar backup dos registros</button>`:""}`});
  $("#pf-ph").addEventListener("click", async()=>{ const f=await pickFiles(); if(!f.length) return; const img=await loadImg(f[0]).catch(()=>null); if(!img) return;
    const c=scale(img,320); const data=c.toDataURL("image/jpeg",.8);
    if(ASSETS){ try{ const b=await new Promise(r=>c.toBlob(r,"image/jpeg",.85)); const up=await ASSETS.upload(b); M.profile.photo=up.url; }catch(e){ M.profile.photo=data; } } else M.profile.photo=data;
    saveMain(); openProfile(); });
  $("#pf-bk")?.addEventListener("click", async()=>{ try{ await DL.save({filename:`caverna-backup-${iso(today())}.json`, data:new Blob([JSON.stringify({M,DAYS},null,1)],{type:"application/json"})}); }catch(e){} });
}

/* ---------- ações da página ---------- */
document.addEventListener("click", e => {
  if(e.target.closest("#sheet")) return;
  const g=e.target.closest("[data-tabgo]"); if(g){ TAB=g.dataset.tabgo; render(); window.scrollTo({top:0}); return; }
  const a=e.target.closest("[data-act]"); if(!a) return;
  const act=a.dataset.act, dstr=a.dataset.d||iso(today());
  if(act==="selday"){ SELDAY = a.dataset.d===iso(today()) ? null : a.dataset.d; render(); }
  else if(act==="bloco") openBlock(dstr, a.dataset.k);
  else if(act==="ok") openBlock(dstr, a.dataset.k);
  else if(act==="finalizar") openFinal();
  else if(act==="metas"){ TAB="evolucao"; EVOTAB="metas"; render(); window.scrollTo({top:0}); }
  else if(act==="anbima"){ TAB="evolucao"; EVOTAB="anbima"; render(); window.scrollTo({top:0}); }
  else if(act==="revisoes") openReviews();
  else if(act==="revisar") openReview(a.dataset.id);
  else if(act==="materia") openSubject(a.dataset.m);
  else if(act==="evotab"){ EVOTAB=a.dataset.k; render(); }
  else if(act==="marco"){ M.marcos[a.dataset.k]=!M.marcos[a.dataset.k]; if(M.marcos.inscricao){ const v=M.vagas.find(x=>x.id==="serasa"); if(v&&v.st==="interesse") v.st="inscrita"; } saveMain(); render(); }
  else if(act==="dia") openDay(a.dataset.d);
  else if(act==="perfil") openProfile();
  else if(act==="simulado") openSimulado();
  else if(act==="erro"){ const er=(M.erros||[]).find(x=>x.id===a.dataset.id); if(!er) return; FLOW={kind:"erro", next:()=>{ er.ok=true; er.porque=$("#er-t").value; saveMain(); closeSheet(); toast("Erro resolvido."); }, back:()=>{}}; openSheet("linear-gradient(170deg,#2A0A10,#05060A 60%)");
    sheetHTML({title:"Caderno de erros", next:"Entendi, resolver", body:`<h2 class="q" style="font-size:30px">${esc(er.p)}</h2><div class="opt wrong"><span class="k">✗</span><span>${esc(er.minha||"(sem resposta)")}</span></div><div class="opt right"><span class="k">✓</span><span>${esc(er.certa)}</span></div><p class="explain">${esc(er.e||"")}</p><label class="field"><span>Por que errei e como reconheço da próxima vez</span><textarea class="ta" id="er-t">${esc(er.porque||"")}</textarea></label>`}); }
  else if(act==="nova-vaga"){ FLOW={kind:"vaga", next:()=>{ const n=$("#vg-n").value.trim(), v=$("#vg-v").value.trim(); if(!n) return; M.vagas.push({id:"v"+Date.now(), n, v, st:"interesse"}); saveMain(); closeSheet(); }, back:()=>{}}; openSheet();
    sheetHTML({title:"Nova vaga", next:"Adicionar", body:`<h2 class="q">Qual porta abrir?</h2><label class="field"><span>Empresa</span><input class="inp" id="vg-n"></label><label class="field"><span>Vaga</span><input class="inp" id="vg-v" placeholder="Ex.: Estágio em dados"></label>`}); }
  else if(act==="panorama-ai") panoramaAI(a);
  else if(act==="pausas"){ M.showPausas=!M.showPausas; saveMain(); render(); }
});
document.addEventListener("change", e => { const s=e.target.closest("[data-vaga]"); if(!s) return; const v=M.vagas.find(x=>x.id===s.dataset.vaga); if(v){ v.st=s.value; saveMain(); } });
document.addEventListener("submit", e => { const f=e.target.closest('[data-form="livre"]'); if(!f) return; e.preventDefault(); const q=f.q.value.trim(); if(!q) return; openStudy({mat:"mat", topic:q, livre:true}); });
async function panoramaAI(btn){
  const box=$("#pan-ai"); btn.disabled=true; const out=document.createElement("div"); out.innerHTML=thinking("Lendo os seus registros…"); box.append(out);
  const last = Object.keys(DAYS).sort().slice(-14).map(d=>({d, ...dayStats(d), nota:DAYS[d].final?DAYS[d].final.nota:null, faltas:Object.values(DAYS[d].blocks||{}).filter(r=>r.st==="nao").map(r=>r.motivo)}));
  const niveis = Object.fromEntries(Object.keys(SUBJ).map(k=>[SUBJ[k].n, levelOf(k).n]));
  try{
    const r = await aiJson(`Faça o PANORAMA honesto do Projeto Caverna com base só nestes dados: últimos dias ${JSON.stringify(last)}; blocos aprovados por matéria ${JSON.stringify(niveis)}; média nas provas ${quizAvg()==null?"-":Math.round(quizAvg()*100)+"%"}; erros abertos ${(M.erros||[]).filter(e=>!e.ok).length}; simulados ANBIMA ${JSON.stringify((M.simulados||[]).slice(-3))}; marcos ${JSON.stringify(M.marcos)}. Responda só com JSON: {"status":"indo bem|atenção|reajustar","resumo":"2 frases","fortes":["",""],"atencao":["",""],"acoes":["ação concreta 1","2","3"]}`);
    out.innerHTML = `<div class="row"><span class="chip" style="background:${r.status==="indo bem"?"var(--ok)":r.status==="atenção"?"var(--warn)":"var(--bad)"};color:#05060A;border:0">${esc(r.status)}</span></div><p>${esc(r.resumo)}</p>
      <div class="grid2"><div><span class="tag">Pontos fortes</span><ul style="padding-left:18px">${(r.fortes||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div><div><span class="tag">Atenção</span><ul style="padding-left:18px">${(r.atencao||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></div>
      <div class="ex"><span class="tag">3 ações desta semana</span><ol style="padding-left:18px;margin:8px 0 0">${(r.acoes||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>`;
  }catch(e){ out.innerHTML=`<p class="note">${esc(aiErr(e))}</p>`; }
  btn.disabled=false;
}

boot();
setInterval(()=>{ const a=document.activeElement; if(SH.hidden && TAB==="hoje" && !(a && a!==document.body && $("#app").contains(a))) render(); }, 60000);
</script>
